name: Sync stock quote cache
# Repository secrets required: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# The service-role key is used here only; never add it to config.js or frontend assets.
on:
  schedule:
    - cron: '*/10 0-4 * * 1-5' # 09:00–13:50 KST, weekdays
    - cron: '0,10,20,30 5 * * 1-5' # 14:00–14:30 KST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-quote-cache
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Refresh registered symbols in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/sync-stocks.py
